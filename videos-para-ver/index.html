let seen={};try{seen=JSON.parse(localStorage.getItem('seen')||'{}')}catch(e){}
function save(){try{localStorage.setItem('seen',JSON.stringify(seen))}catch(e){}}
function row(v,why){
  const d=document.createElement('div');d.className='row'+(seen[v.id]?' done':'');d.dataset.t=(v.titulo+' '+(why||'')).toLowerCase();
  const c=document.createElement('input');c.type='checkbox';c.checked=!!seen[v.id];
  c.onchange=()=>{seen[v.id]=c.checked;save();document.querySelectorAll('[data-id="'+v.id+'"]').forEach(x=>{x.classList.toggle('done',c.checked);x.querySelector('input').checked=c.checked})};
  d.dataset.id=v.id;d.appendChild(c);
  const b=document.createElement('div');
  const t=v.url?'<a href="'+v.url+'" target="_blank" rel="noopener">'+esc(v.titulo)+'</a>':'<span class="t lock">'+esc(v.titulo)+' (sin enlace: '+esc(v.estado||'bloqueada')+')</span>';
  b.innerHTML=t+'<small>'+(v.dur||v.min?'':'')+(v.dur?v.dur+' · ':'')+(why?esc(why):'')+'</small>';
  d.appendChild(b);return d}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const P=document.getElementById('prio');
D.prio.forEach(g=>{const h=document.createElement('h3');h.textContent=g.t+(g.min?' · '+g.min+' min':'');P.appendChild(h);
  const c=document.createElement('div');c.className='card';g.items.forEach(v=>c.appendChild(row(v,v.why)));P.appendChild(c)});
const A=document.getElementById('all');
D.cursos.forEach(cu=>{const n=cu.mods.reduce((a,m)=>a+m.l.length,0);const de=document.createElement('details');
  de.innerHTML='<summary>'+esc(cu.n)+' <span class="pill">('+n+')</span></summary>';
  cu.mods.forEach(m=>{const h=document.createElement('h3');h.textContent=m.n==='Sin módulo'?'':m.n;de.appendChild(h);
    const c=document.createElement('div');c.className='card';m.l.forEach(v=>c.appendChild(row(v)));de.appendChild(c)});A.appendChild(de)});
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.row').forEach(r=>r.style.display=!q||r.dataset.t.includes(q)?'':'none');
  document.querySelectorAll('#all details').forEach(d=>{if(q)d.open=!!d.querySelector('.row:not([style*="none"])');d.style.display=(!q||d.querySelector('.row:not([style*="none"])'))?'':'none'})};
